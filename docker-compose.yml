# Menjalankan image produksi secara lokal: docker compose up --build
# Seluruh konfigurasi dibaca dari .env — berkas ini ikut git, jadi JANGAN menulis
# rahasia (kunci, kata sandi, token) di sini.
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:80"
        env_file:
            - .env
        volumes:
            - ./storage/app:/var/www/html/storage/app
            - ./storage/logs:/var/www/html/storage/logs
